# 一時的なワークフロー: 書き換え前の履歴（10/18〜10/21 朝の旧コミット）を指す
# Pages のデプロイ記録と Actions の実行記録を削除する。これらが古いコミットへの参照として残り、
# GitHub の GC で消えないため。公開中のデプロイ（新しい履歴）は対象外。実行後にこのファイルは削除する。
name: 旧履歴の参照の掃除（一時）

on:
  workflow_dispatch:

permissions:
  actions: write
  deployments: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 旧コミットを指すデプロイ記録と実行記録を削除
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF: ${{ github.run_id }}
          OLD_SHAS: |
            c452b60fc55f626414cf700d10166b4dd4070a7f
            bd2c1ee513cb9dc095f1066ab817d613eae841ed
            b41889fdca5d739dadac8cdf97be3fb3e9e3cd50
            e84e369e5e9a2c7dd6b065a6e8867312c71d0692
            8ea01d978163d86df0d5ca5baa4ac62f09fef5b5
            d9d6d039a039928c7e8ddc3e9881ffb3fa85d753
            1dbc677afb9a7be2b0cfa0b537eda6bc1d700288
            a39e591eb7daeedf77396347b49c4ecd761dfe4f
            3500cb4ae21b307d3304e565886dc6470b06e303
            6bb4eec44a70bb0efa2278e1a47045967dc3ab68
            ed4a42b3ab02e0117d6a47edef8bfefea1ffff2f
            4234caf57342df73fb93094d9421f1e5bec8d363
            0c672b410cafdf1eb152f1ddeeb6ec5649bb8db7
            73d5aa1890ac1ffe99c7ba684222859ba15390a4
            33acb9176aa5caa6306e245cc9a43f418c2fe778
            c70fd5a9ba5d3b2f4403769a0de17ef9f2174568
            f96f61f0f79c327294dc210048c8bf2808877708
            80c969f95e70f755c5a4ebcfc659596ab7832429
            fadc7b6e37b5a1a10187a8ef50522066ede63732
            e8cecb10dbef95fc9c905460df77e2cb83018399
            77c7abb03ded922f50afad7fff357c483e95d784
            0bbf2a763a6ed714ce552e0947f405ac0b195a4c
            b918276a27fb116ea82e2c485b81abbb91b44427
            c8cfc41ca04f1b48a1233086c2f74f038d38b632
            06daf41182971b9baf6e29523450f96d7c82924a
            b369347f847898920682247a1744892e3c344736
            1b6e6a4abb40c1cf31c2349fe6c9a8a42e24981a
            e905c082d2a2c44f50a6caf6cfe26b27ae359d40
            5fa6e72b1f43dbf847ef764fce2c981657f7c838
            7ae9511662b9786dd798c022849e372ee6cd2a37
            0d36255daf2e3e584a8f036259df92ef2758349a
            e49aa6e10a3366613304726de34c88beef85c3ca
            7e0c049cfff203b6961a9496d387350df8692873
            c160b935b0c67dfb59345bac653e4d2356a1baf8
            b502d434e4cc29f078cd87d032cc543bd064b7d0
            7029c1422564a24a5f966315fb12a06c47f89460
            f687ece1216b8bd0830d56f05250cc5b69e4756e
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          tok, repo, me = os.environ['TOKEN'], os.environ['REPO'], int(os.environ['SELF'])
          old = set(os.environ['OLD_SHAS'].split())
          def call(method, path, data=None):
              req = urllib.request.Request('https://api.github.com' + path, method=method,
                  data=json.dumps(data).encode() if data is not None else None, headers={
                  'Authorization': 'Bearer ' + tok, 'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req) as r:
                  body = r.read()
                  return json.loads(body) if body else None
          def all_pages(path, key=None):
              out, page = [], 1
              while True:
                  sep = '&' if '?' in path else '?'
                  d = call('GET', f'{path}{sep}per_page=100&page={page}')
                  items = d[key] if key else d
                  out += items
                  if len(items) < 100:
                      return out
                  page += 1
          lines, fail = [f'旧コミット {len(old)} 件', ''], 0
          deps = all_pages(f'/repos/{repo}/deployments')
          target = [d for d in deps if d['sha'] in old]
          lines.append(f'デプロイ記録: 全 {len(deps)} 件のうち対象 {len(target)} 件')
          ok = 0
          for d in target:
              try:
                  try:
                      call('DELETE', f"/repos/{repo}/deployments/{d['id']}")
                  except urllib.error.HTTPError as e:
                      if e.code != 422:
                          raise
                      # 有効なままのデプロイは削除できないので、無効にしてから削除する
                      call('POST', f"/repos/{repo}/deployments/{d['id']}/statuses", {'state': 'inactive'})
                      call('DELETE', f"/repos/{repo}/deployments/{d['id']}")
                  ok += 1
              except Exception as e:
                  fail += 1
                  lines.append(f"- 失敗: デプロイ {d['id']} {d['created_at']} ({e})")
          lines.append(f'デプロイ記録の削除: {ok} / {len(target)}')
          runs = all_pages(f'/repos/{repo}/actions/runs', 'workflow_runs')
          target = [r for r in runs if r['head_sha'] in old and r['id'] != me]
          lines.append(f'実行記録: 全 {len(runs)} 件のうち対象 {len(target)} 件')
          ok = 0
          for r in target:
              try:
                  call('DELETE', f"/repos/{repo}/actions/runs/{r['id']}")
                  ok += 1
              except Exception as e:
                  fail += 1
                  lines.append(f"- 失敗: {r['name']} {r['created_at']} ({e})")
          lines.append(f'実行記録の削除: {ok} / {len(target)}')
          print('\n'.join(lines))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n'.join(lines) + '\n')
          if fail:
              raise SystemExit(1)
          PY
