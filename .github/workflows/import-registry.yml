name: 登録馬名簿の取り込み（一回）
# JRA の競走馬登録馬名簿 PDF を OCR で読み、現役馬の「馬名 → クラブID（クラブ以外は空文字）」を data/names.json に保存する。
# 一度だけ手動で実行する（tools/import_registry.py）。JRA へは名簿のページ1回と PDF 十数ファイルを2秒間隔で取るだけ。
# write をオフにすると、精度の確認（races.json のクラブ馬が名簿で正しいクラブとして見つかるか）だけをして保存しない。
on:
  workflow_dispatch:
    inputs:
      write:
        description: 'data/names.json に保存して push する'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-jpn >/dev/null
          pip install -q beautifulsoup4==4.12.3 numpy pillow
      - name: 名簿の PDF を取得
        run: |
          UA='Mozilla/5.0 (compatible; racecard/1.0; +https://github.com/saboten-no-hana/racecard)'
          B=https://www.jra.go.jp/datafile/resist/
          mkdir -p pdf
          curl -sS -f -A "$UA" "$B" -o pdf/index.html
          grep -o 'pdf/registration_[A-Za-z0-9_-]*\.pdf' pdf/index.html | sort -u > pdf/list.txt
          echo "PDF $(wc -l < pdf/list.txt) ファイル"; grep -o '[0-9]*月[0-9]*日（[^）]*）現在' pdf/index.html | head -1
          while read p; do sleep 2; curl -sS -f -A "$UA" "$B$p" -o "pdf/$(basename $p)" -w "$p %{http_code} %{size_download}\n"; done < pdf/list.txt
      - name: OCR で読む
        run: |
          ARGS="--check data/races.json"
          if [ "${{ inputs.write }}" = true ]; then ARGS="$ARGS --write"; fi
          python3 tools/import_registry.py pdf $ARGS
      - name: Commit
        if: ${{ inputs.write }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/names.json
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "登録馬名簿を取り込み（馬名 → クラブID）"
          git pull --rebase -q origin main
          git push
