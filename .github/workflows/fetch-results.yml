name: 結果の取得
# 結果カード用に、JRA のレース結果からクラブ馬の着順などを集めて data/results.json を更新する（tools/fetch_results.py、10/24〜）。
#   クラブ馬の出るレースだけ、発走の18分後に競馬場ごとの全レースまとめを読み、そろうまで3分おきに読み直す（発走40分後まで）。
#   結果が取れるたびに1レースごとにコミットして push（1時間に8回まで。超える分は次にまとめる）
#   今日の開催が races.json にない日は JRA にアクセスせずに終わる（毎日起動しても平日は何もしない）
# 起動（GitHub の定期実行は30〜50分遅れることがあるので、早めに起動してスクリプト側で各レースの時刻まで待つ）:
#   am    毎日 07:40 JST 起動 → 13:00 まで。残りがあれば、終わる時に pm を手動実行の形で起動する（定期実行の遅れを受けない）
#   pm    am から起動 → 18:00 まで
#   final 毎日 19:07 JST。まだそろっていないレースのある場だけ、全レースまとめを1回ずつ読む（取りこぼしの仕上げ）
# 1開催日のリクエスト数の見込み: 40〜45（10/25 の試しは発走13分後から読んで68回。18分後にして読み直しを減らした）
# 時刻は UTC（日本時間 = UTC+9）。
on:
  schedule:
    - cron: '40 22 * * *'   # 07:40 JST（UTC では前日）am
    - cron: '7 10 * * *'    # 19:07 JST final
  workflow_dispatch:
    inputs:
      mode:
        description: '取得の仕方（am=午前の回／pm=午後の回／final=仕上げ）'
        type: choice
        options: [am, pm, final]
        default: final
permissions:
  contents: write
  actions: write   # am から pm を起動するため
concurrency:
  group: fetch-results
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.12.3
      - name: 結果を取得（1レースごとにコミットして push）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          case "${{ github.event.schedule }}${{ inputs.mode }}" in
            '40 22 * * *'|am) ARGS="--until 13:00 --pending-flag $RUNNER_TEMP/pending"; echo am > "$RUNNER_TEMP/mode" ;;
            pm) ARGS='--until 18:00' ;;
            *) ARGS='--final' ;;
          esac
          python3 tools/fetch_results.py $ARGS --push
      - name: 午後の回を起動
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "$RUNNER_TEMP/mode" ] && [ -f "$RUNNER_TEMP/pending" ]; then
            echo "残り $(cat "$RUNNER_TEMP/pending") レース → 午後の回を起動"
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/fetch-results.yml/dispatches" \
              -d '{"ref":"main","inputs":{"mode":"pm"}}'
          else
            echo "午後の回は不要"
          fi
