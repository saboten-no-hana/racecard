name: 結果の取得
# 結果カード用に、JRA のレース結果からクラブ馬の着順などを集めて data/results.json を更新する（tools/fetch_results.py、10/24〜）。
#   クラブ馬の出るレースだけ、発走の18分後に競馬場ごとの全レースまとめを読み、そろうまで3分おきに読み直す（発走40分後まで）。
#   結果が取れるたびに1レースごとにコミットして push（1時間に8回まで。超える分は次にまとめる）
#   今日の開催が races.json にない日は JRA にアクセスせずに終わる（毎日起動しても平日は何もしない）
# 起動（GitHub の定期実行は30〜50分、ときに数時間遅れ、抜けることもあるので、何回かに分けて起動する。10/26〜）:
#   auto  07:40 と、予備の 09:20・11:20・13:20・15:20。どの回も「その日の残りのレース」を取る（午前・午後の区別はない）。
#         1回は起動から5時間半か 18:00（最終レースが遅い日は発走45分後。2027年夏の1日7競走は18:30ごろ）まで。時間切れで残りがあれば、終わる時に次の回を手動実行の形で起動する（定期実行の遅れを受けない）。
#         読み取りに失敗しても3分後に読み直し、3回続けて失敗したら止める。止まった時は代わりの回を1回だけ起動する（15分待ってから読む）。
#         同じ場のレースが2つ続けて発走40分後まで何も載らなければ（開催中止など）、その回ではその場を読まない。
#         同じグループの実行は1つずつ順に動き、待っている実行は新しい待ちに置き換えられる。どの回が残っても同じ仕事をするので、
#         予備の回が来ても取得済みのレースは読まず、何もなければ JRA にアクセスせずに数秒で終わる
#   final 毎日 19:07 JST。まだそろっていないレースのある場だけ、全レースまとめを1回ずつ読む（取りこぼしの仕上げ）
#         正午より前に動いた時は前の日の分（10/25 は定期実行が4時間遅れて 23:15 に起動した）。
#         手動実行で date を入れると、その日の分を取り直す（定期実行が来なかった日のため）
# 1開催日のリクエスト数の見込み: 40〜50（10/25 の試しは発走13分後から読んで68回。18分後にして読み直しを減らした。
#   回が変わるたびに結果トップ・開催のページを読み直すので、1回あたり最大4ほど増える）
# 時刻は UTC（日本時間 = UTC+9）。
on:
  schedule:
    - cron: '40 22 * * *'   # 07:40 JST（UTC では前日）auto
    - cron: '20 0 * * *'    # 09:20 JST auto（予備）
    - cron: '20 2 * * *'    # 11:20 JST auto（予備）
    - cron: '20 4 * * *'    # 13:20 JST auto（予備）
    - cron: '20 6 * * *'    # 15:20 JST auto（予備）
    - cron: '7 10 * * *'    # 19:07 JST final
  workflow_dispatch:
    inputs:
      mode:
        description: '取得の仕方（final=仕上げ／auto=その日の残りのレースを順に取る）'
        type: choice
        options: [final, auto]
        default: final
      date:
        description: '仕上げで取り直す日（YYYY-MM-DD。空なら今日。正午より前は前の日）。定期実行が来なかった日の取り直し用'
        required: false
        default: ''
      after_error:
        description: '（自動で使う欄。手動では空のまま）前の回が読み取りの失敗で止まった時の代わりの回なら 1'
        required: false
        default: ''
permissions:
  contents: write
  actions: write   # 時間切れの時に次の回を起動するため
concurrency:
  group: fetch-results
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: 最新の main を取り込む
        # 待機していた実行（手動で取った後に順番が来た定期実行など）は、起動が登録された時点の古いコミットで
        # 動くため、古い data/ を見て同じ取得をやり直してしまう（10/22 に出馬表で起きた）。取得の前に最新にそろえる（10/26〜）
        if: github.ref == 'refs/heads/main'
        run: git fetch -q origin main && git reset -q --hard origin/main && git log --oneline -1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.12.3
      - name: 結果を取得（1レースごとにコミットして push）
        env:
          SCHED: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
          DATE: ${{ inputs.date }}   # 手動実行の入力はシェルに直接埋め込まず、環境変数で渡す（10/26〜）
          AFTER_ERROR: ${{ inputs.after_error }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if [ "$SCHED" = '7 10 * * *' ] || { [ -z "$SCHED" ] && [ "$MODE" != auto ]; }; then
            set -- --final
            if [ -n "$DATE" ]; then set -- --final --date "$DATE"; fi
          else
            set -- --auto --pending-flag "$RUNNER_TEMP/pending"
            if [ "$AFTER_ERROR" = 1 ]; then set -- "$@" --after-error; fi
          fi
          python3 tools/fetch_results.py "$@" --push
      - name: 次の回を起動
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "$RUNNER_TEMP/pending" ]; then
            # 中身が error なら、読み取りの失敗が続いて止まった回の代わり（次の回は15分待ってから読む。その回がまた止まったら起動しない）
            if [ "$(cat "$RUNNER_TEMP/pending")" = error ]; then
              echo "読み取りの失敗が続いて止まった → 代わりの回を1回だけ起動"
              BODY='{"ref":"main","inputs":{"mode":"auto","after_error":"1"}}'
            else
              echo "時間切れで残り $(cat "$RUNNER_TEMP/pending") レース → 次の回を起動"
              BODY='{"ref":"main","inputs":{"mode":"auto"}}'
            fi
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/fetch-results.yml/dispatches" \
              -d "$BODY"
          else
            echo "次の回は不要"
          fi
